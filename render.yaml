# Blueprint de Render: API + orquestador + Postgres. Ver docs/desarrollo.md § Deploy.
# Los valores con sync: false se cargan a mano en el dashboard (no van al repo).
envVarGroups:
  - name: viaz-comun
    envVars:
      - key: WORKER_TOKEN        # el pod GPU usa este mismo valor
        generateValue: true
      - key: VIAZ_AGENTES        # fijo = fixtures; claude = Claude API. Con claude, sin clave válida el orquestador no arranca
        value: claude
      - key: VIAZ_CLAUDE         # Render usa solo clave de API: la suscripción es solo para uso local (pendientes, 3)
        value: api
      - key: VIAZ_ALMACEN
        value: r2
      - key: VIAZ_MODELO
        value: claude-opus-5-5
      - key: VIAZ_FLUJO              # rl = demo con entrenamiento; planificador = flujo anterior
        value: rl
      # Primera corrida real (pendientes, 9A y 12A): 1 finalista, 1 h, monitor cada 30 min con cupo de Claude.
      - key: VIAZ_HORAS_ENTRENAMIENTO
        value: "1"
      - key: VIAZ_MAX_FINALISTAS
        value: "1"
      - key: VIAZ_MONITOR_S
        value: "1800"
      - key: VIAZ_MONITOR_MAX_LLAMADAS
        value: "6"
      - key: VIAZ_BUSQUEDA
        value: "1"
      - key: VIAZ_TAREA_AGENTE       # 1: el agente Tarea escribe tarea.json (pendientes, 1A)
        value: "1"
      - key: VIAZ_ADMIN_TOKEN        # para POST /corridas/{id}/detener
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8

services:
  - type: web
    name: viaz-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install ".[postgres]"
    startCommand: uvicorn viaz.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - fromGroup: viaz-comun
      - key: DATABASE_URL
        fromDatabase: { name: viaz-db, property: connectionString }
      - key: VIAZ_ORIGENES       # ej: https://viaz.vercel.app,http://localhost:3000
        sync: false
      - key: VIAZ_CORRIDA_DEMO   # id de la corrida de respaldo para /corridas/demo
        sync: false
      - key: VIAZ_MAX_CORRIDAS_ACTIVAS   # POST /corridas sin token: tope de gasto de Claude y GPU
        value: "2"
      - key: VIAZ_VENTANA_CORRIDAS_H   # grabar_clips + evaluar pueden esperar 6 h sin tocar la fila
        value: "7"
      - { key: R2_ENDPOINT, sync: false }
      - { key: R2_BUCKET, sync: false }
      - { key: R2_ACCESS_KEY_ID, sync: false }
      - { key: R2_SECRET_ACCESS_KEY, sync: false }

  - type: worker
    name: viaz-orquestador
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install ".[postgres]"
    startCommand: python -m viaz.orquestador
    envVars:
      - fromGroup: viaz-comun
      - key: DATABASE_URL
        fromDatabase: { name: viaz-db, property: connectionString }
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VIAZ_DISCORD_WEBHOOK    # avisos del monitor (#entrenamiento). Secreto: no va al repo
        sync: false
      - key: VIAZ_ENTORNO_MANUAL     # ruta al entorno.json del parque de referencia (vacío = fixture)
        sync: false
      - key: VIAZ_TAREA_MANUAL
        sync: false
      - { key: R2_ENDPOINT, sync: false }
      - { key: R2_BUCKET, sync: false }
      - { key: R2_ACCESS_KEY_ID, sync: false }
      - { key: R2_SECRET_ACCESS_KEY, sync: false }

databases:
  - name: viaz-db
    plan: basic-256mb
