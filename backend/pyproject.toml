[project]
name = "viaz"
version = "0.1.0"
description = "VIAZ: API y orquestador de agentes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "jsonschema>=4.22",
  "anthropic>=0.70",
  "imageio-ffmpeg>=0.5",
  "boto3>=1.34",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "httpx>=0.27", "requests>=2.31", "pillow>=10.1", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["viaz*"]

[tool.setuptools.package-data]
viaz = ["esquemas/*.json", "fixtures/*.json", "catalogo/*.json", "catalogo/robots/*.json", "agentes/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
