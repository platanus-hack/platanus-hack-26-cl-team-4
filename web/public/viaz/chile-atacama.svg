  <style>
    .barrido { animation: barrido 5.5s ease-in-out infinite; }
    .pulso { transform-origin: 229px 85px; animation: pulso 3s ease-out infinite; }
    @keyframes barrido { from { transform: translateY(-70px); } to { transform: translateY(318px); } }
    @keyframes pulso { 0% { opacity: .85; transform: scale(.8); } 80%, 100% { opacity: 0; transform: scale(2.15); } }
    @media (prefers-reduced-motion: reduce) { .barrido, .pulso { display: none; } }
  </style>
